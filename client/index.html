<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Oriel — Architecture & Interiors, Lisbon & Copenhagen</title>
    <meta name="description" content="Oriel is an architecture and interiors studio in Lisbon and Copenhagen, designing calm, material-led homes, workplaces and small hotels." />
    <meta name="theme-color" content="#121110" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161513'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F1EDE6' stroke-width='2.5'/%3E%3C/svg%3E" />

    <!-- Hide animated elements before first paint. Skipped entirely for reduced motion.
         Safety net: if the app never signals readiness, reveal everything after 3.5s. -->
    <script>
      (function () {
        var d = document.documentElement;
        // ?motion forces animation on even with reduced motion (debugging only).
        var force = /[?&]motion\b/.test(location.search);
        var reduce = !force && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) return;
        d.classList.add('motion');
        window.__motionSafety = setTimeout(function () {
          if (!window.__motionReady) d.classList.remove('motion');
        }, 3500);
      })();
    </script>

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" />
  </head>
  <body>
    <!-- Loader / page-transition curtain (driven by src/lib/motion.js) -->
    <div class="curtain" id="curtain" aria-hidden="true">
      <div class="curtain__inner">
        <span class="curtain__brand">Oriel</span>
        <span class="curtain__count"><span id="curtain-count">0</span>%</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
